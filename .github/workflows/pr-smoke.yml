name: PR smoke

on:
  pull_request:
    branches: [main]
  push:
    # TEMPORARY: phase-3 lets this run before a PR exists. Remove before merging.
    branches: [main, phase-3]
  workflow_dispatch:

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: pr-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap checks first and in parallel with the app build, so a style or type error fails in seconds.
  static:
    name: Lint, typecheck, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  smoke:
    name: Smoke (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Building the app was most of the pipeline time, so build with a layer cache and
      # start the containers without rebuilding them.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            api.cache-from=type=gha,scope=api
            api.cache-to=type=gha,scope=api,mode=max
            frontend.cache-from=type=gha,scope=frontend
            frontend.cache-to=type=gha,scope=frontend,mode=max
      - name: Start app under test
        run: docker compose up -d --wait --no-build

      - run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/2

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs --no-color

      # Each shard writes a blob report; the next job merges them into one HTML report.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge reports
    needs: smoke
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # One stable check name for branch protection, however many shards the matrix has.
  gate:
    name: PR gate
    needs: [static, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks and every smoke shard to pass
        run: |
          echo "static: ${{ needs.static.result }}, smoke: ${{ needs.smoke.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.smoke.result }}" = "success" ]
