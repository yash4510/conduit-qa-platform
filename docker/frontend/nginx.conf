server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (e.g. /login) must fall back to index.html, or a reload 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry point, so a rebuilt image is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
